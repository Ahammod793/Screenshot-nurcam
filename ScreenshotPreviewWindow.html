<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NurCam Screenshot Editor</title><link rel="stylesheet" href="ScreenshotPreviewWindow.css"></head><body><main class="editor"><nav class="toolbar">
<div class="group"><button data-tool="crop">Crop</button><button id="applyCrop" disabled>Apply Crop</button><button id="cancelCrop" disabled>Cancel Crop</button><label>Ratio <select id="ratio"><option>Free</option><option>1:1</option><option>4:3</option><option>16:9</option></select></label><span id="dimensions">No selection</span></div>
<div class="group tools"><button data-tool="arrow">Arrow</button><button data-tool="line">Line</button><button data-tool="pen">Pen</button><button data-tool="rectangle">Rectangle</button><button data-tool="ellipse">Ellipse</button><button data-tool="highlight">Highlight</button><button data-tool="text">Text</button><button data-tool="number">Number</button><button id="cancelDrawing" disabled>Cancel Drawing</button></div>
<div class="group"><label>Color <select id="color"><option>Red</option><option>Blue</option><option>Green</option><option>Yellow</option><option>White</option><option>Black</option></select></label><label>Width <input id="thickness" type="range" min="1" max="12" value="3"></label><span id="thicknessText">3 px</span><button data-tool="pixelate">Pixelate</button><button data-tool="blur">Blur</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="reset">Reset</button></div></nav>
<section class="stage"><div class="image-area"><canvas id="imageCanvas"></canvas><canvas id="interactionCanvas"></canvas></div></section>
<footer><button id="copy">Copy</button><button id="cancel">Cancel</button><label class="format">Format <select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></label><button id="save" class="save">Save</button></footer><p id="status"></p></main><script src="NativeImageEditor.js"></script><script src="ScreenshotPreviewWindow.js"></script></body></html>
